name: forensic skill tests

# Runs the Binance-Alpha forensic skill (v06) test suite on every change to it.
# The point of this gate is the INTEGRATION class of bug: v1.2.2 shipped a
# multi-chain chip-three-way crash that 9 rounds of unit-level diff review missed
# because no full pipeline path was ever executed. tests/test_supply_chain_smoke.py
# now runs that path offline (surf/RPC mocked) so the crash class fails CI here
# instead of in a live report.

# SECURITY: no workflow in this repo needs write access. The default
# GITHUB_TOKEN is read/write for most repos, so a compromised action or a
# script-injection in a `run:` block could push commits or modify releases.
# Grant the narrowest scope that still lets the job check out code.
permissions:
  contents: read

on:
  push:
    paths:
      - 'skills/hertzflow/alpha/v06/**'
      - '.github/workflows/forensic-tests.yml'
  pull_request:
    paths:
      - 'skills/hertzflow/alpha/v06/**'
      - '.github/workflows/forensic-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # SECURITY: actions are pinned to a full commit SHA, not a mutable tag.
      # A tag like @v4 can be repointed at new upstream code by anyone who
      # compromises the action repo; a SHA cannot. The trailing comment
      # records the human-readable version for auditability.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install deps
        # SECURITY: versions are pinned (==) so a malicious or broken
        # upstream release cannot be pulled into CI unreviewed. Hash pinning
        # with pip-tools/--require-hashes is the stronger option if the
        # dependency set ever grows.
        run: pip install "pytest==8.3.4" "jinja2==3.1.5"
      - name: Run v06 test suite
        working-directory: skills/hertzflow/alpha/v06
        # `zh_json_term_discipline` (派发-vs-分发 whitelist) is a PRE-EXISTING red:
        # the allow-list lags ~36 newer zh.json keys (a term-discipline cleanup
        # tracked separately). It is deselected here so it does not mask NEW
        # failures — every other test, including the multi-chain smoke guard, runs.
        run: python -m pytest tests/ -q -k "not zh_json_term_discipline"
